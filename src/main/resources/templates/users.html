<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Admin panel</title>

  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<!--TOP-->
<nav class="navbar navbar-dark bg-dark px-4">
  <div class="container-fluid">

    <span class="navbar-text text-white">

  <strong th:text="${currentUser.username}"></strong>

  <span> with roles: [</span>

  <span th:each="role, iterStat : ${currentUser.roles}">

    <span th:text="${#strings.replace(role.name, 'ROLE_', '')}"></span>

    <span th:if="${!iterStat.last}">, </span>

  </span>

  <span>]</span>

</span>

    <form th:action="@{/logout}" method="post">
      <button type="submit"
              class="btn btn-link text-secondary text-decoration-none p-0">
        Logout
      </button>
    </form>

  </div>
</nav>


<div class="container-fluid">

  <div class="row">

    <!--LEFT-->
    <div class="col-2 bg-light min-vh-100 p-0">

      <div class="list-group list-group-flush">

        <a th:href="@{/admin}"
           class="list-group-item list-group-item-action active">
          Admin
        </a>

        <a th:href="@{/user}"
           class="list-group-item list-group-item-action">
          User
        </a>

      </div>

    </div>


    <!--MAIN-->
    <div class="col-10 p-4">

      <h1 class="mb-4">Admin panel</h1>

      <!--TABS-->
      <ul class="nav nav-tabs mb-3">

        <li class="nav-item">
          <button class="nav-link active"
                  id="allUsersTab"
                  type="button">
            All Users
          </button>
        </li>

        <li class="nav-item">
          <button class="nav-link"
                  id="newUserTab"
                  type="button">
            New User
          </button>
        </li>

      </ul>


      <!--CARD-->

      <!-- NEW USER FORM -->
      <div id="newUserSection" class="card mb-3" style="display: none;">

        <div class="card-header fw-bold">
          Add new user
        </div>

        <div class="card-body">

          <form id="newUserForm" autocomplete="off">
            <div class="row justify-content-center">
              <div class="col-md-6 col-lg-4">

                <div class="mb-3">
                  <label class="form-label fw-semibold">
                    First Name
                  </label>
                  <input type="text"
                         class="form-control"
                         id="newFirstName">
                  <div class="text-danger" id="newFirstNameError"></div>

                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold">
                    Last Name
                  </label>
                  <input type="text"
                         class="form-control"
                         id="newLastName">
                  <div class="text-danger" id="newLastNameError"></div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold">
                    Age
                  </label>
                  <input type="number"
                         class="form-control"
                         id="newAge">
                  <div class="text-danger" id="newAgeError"></div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold">
                    Username
                  </label>
                  <input type="text"
                         class="form-control"
                         id="newUsername"
                         autocomplete="off">
                  <div class="text-danger" id="newUsernameError"></div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold">
                    Password
                  </label>
                  <input type="password"
                         class="form-control"
                         id="newPassword"
                         autocomplete="new-password">
                  <div class="text-danger" id="newPasswordError"></div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold">
                    Roles
                  </label>

                  <div id="newRoles"></div>
                  <div class="text-danger" id="newRolesError"></div>
                </div>

                <div class="mt-4 text-center">
                  <button type="submit"
                          class="btn btn-success">
                    Add new user
                  </button>
                </div>

              </div>
            </div>

          </form>

        </div>
      </div>

      <div class="card" id="allUsersSection" >

        <div class="card-header fw-bold">
          All Users
        </div>

        <div class="card-body">

          <table class="table table-striped align-middle">

            <thead>
            <tr>
              <th>ID</th>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Age</th>
              <th>Username</th>
              <th>Roles</th>
              <th>Edit</th>
              <th>Delete</th>
            </tr>
            </thead>

            <tbody id="usersTableBody">
            </tbody>

          </table>


          <!-- MODALS -->
          <!-- MODALS -->

          <!-- EDIT MODAL -->
          <div class="modal fade"
               id="editModal"
               tabindex="-1"
               aria-hidden="true">

            <div class="modal-dialog">
              <div class="modal-content">

                <div class="modal-header">
                  <h5 class="modal-title">Edit user</h5>

                  <button type="button"
                          class="btn-close"
                          data-bs-dismiss="modal">
                  </button>
                </div>

                <form id="editForm" autocomplete="off">

                  <div class="modal-body">

                    <div class="mb-3">
                      <label class="form-label fw-semibold">ID</label>

                      <input type="text"
                             class="form-control"
                             id="editId"
                             disabled>
                    </div>

                    <div class="mb-3">
                      <label class="form-label fw-semibold">First Name</label>

                      <input type="text"
                             class="form-control"
                             id="editFirstName">
                      <div class="text-danger" id="editFirstNameError"></div>
                    </div>

                    <div class="mb-3">
                      <label class="form-label fw-semibold">Last Name</label>

                      <input type="text"
                             class="form-control"
                             id="editLastName">
                      <div class="text-danger" id="editLastNameError"></div>

                    </div>

                    <div class="mb-3">
                      <label class="form-label fw-semibold">Age</label>

                      <input type="number"
                             class="form-control"
                             id="editAge">
                      <div class="text-danger" id="editAgeError"></div>
                    </div>

                    <div class="mb-3">
                      <label class="form-label fw-semibold">Username</label>

                      <input type="text"
                             class="form-control"
                             id="editUsername"
                             autocomplete="off">
                      <div class="text-danger" id="editUsernameError"></div>
                    </div>

                    <div class="mb-3">
                      <label class="form-label fw-semibold">Password</label>

                      <input type="password"
                             class="form-control"
                             id="editPassword"
                             autocomplete="new-password">

                      <div class="form-text">
                        Leave empty to keep current password.
                      </div>

                      <div class="text-danger"
                           id="editPasswordError">
                      </div>

                    </div>

                    <div class="mb-3">
                      <label class="form-label fw-semibold">Roles</label>

                      <div id="editRoles"></div>
                      <div class="text-danger" id="editRolesError"></div>
                    </div>

                  </div>

                  <div class="modal-footer">

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                      Close
                    </button>

                    <button type="submit"
                            class="btn btn-primary">
                      Edit
                    </button>

                  </div>

                </form>

              </div>
            </div>
          </div>


          <!-- DELETE MODAL -->
          <div class="modal fade"
               id="deleteModal"
               tabindex="-1"
               aria-hidden="true">

            <div class="modal-dialog">
              <div class="modal-content">

                <div class="modal-header">
                  <h5 class="modal-title">Delete user</h5>

                  <button type="button"
                          class="btn-close"
                          data-bs-dismiss="modal">
                  </button>
                </div>

                <div class="modal-body">
                  Are you sure you want to delete this user?
                </div>

                <div class="modal-footer">
                  <button type="button"
                          class="btn btn-secondary"
                          data-bs-dismiss="modal">
                    Close
                  </button>

                  <button type="button"
                          class="btn btn-danger"
                          id="confirmDeleteButton">
                    Delete
                  </button>
                </div>

              </div>
            </div>
          </div>

        </div>

      </div>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>

</body>
</html>
