<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Admin panel</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<!--TOP-->
<nav class="navbar navbar-dark bg-dark px-4">
  <div class="container-fluid">

        <span class="navbar-text text-white">
            Admin panel
        </span>

    <form th:action="@{/logout}" method="post">
      <button type="submit"
              class="btn btn-outline-light btn-sm">
        Logout
      </button>
    </form>

  </div>
</nav>


<div class="container-fluid">

  <div class="row">

    <!--LEFT-->
    <div class="col-2 bg-light min-vh-100 p-0">

      <div class="list-group list-group-flush">

        <a th:href="@{/admin}"
           class="list-group-item list-group-item-action active">
          Admin
        </a>

        <a th:href="@{/user}"
           class="list-group-item list-group-item-action">
          User
        </a>

      </div>

    </div>


    <!--MAIN-->
    <div class="col-10 p-4">

      <h1 class="mb-4">Admin panel</h1>

      <!--TABS-->
      <ul class="nav nav-tabs mb-3">

        <li class="nav-item">
          <a class="nav-link active"
             th:href="@{/admin}">
            All Users
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link"
             th:href="@{/admin/new}">
            New User
          </a>
        </li>

      </ul>


      <!--CARD-->
      <div class="card">

        <div class="card-header fw-bold">
          All Users
        </div>

        <div class="card-body">

          <table class="table table-striped align-middle">

            <thead>
            <tr>
              <th>ID</th>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Age</th>
              <th>Username</th>
              <th>Roles</th>
              <th>Edit</th>
              <th>Delete</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="user : ${users}">

              <td th:text="${user.id}"></td>

              <td th:text="${user.firstName}"></td>

              <td th:text="${user.lastName}"></td>

              <td th:text="${user.age}"></td>

              <td th:text="${user.username}"></td>

              <td>
                  <span th:each="role : ${user.roles}"
                        class="badge bg-secondary me-1"
                        th:text="${role.name}">
                  </span>
              </td>

              <td>
                <button type="button"
                        class="btn btn-info btn-sm text-white"
                        data-bs-toggle="modal"
                        th:data-bs-target="'#editModal-' + ${user.id}">
                  Edit
                </button>
              </td>

              <td>
                <form th:action="@{/admin/{id}(id=${user.id})}"
                      method="post">

                  <input type="hidden"
                         name="_method"
                         value="delete">

                  <button type="submit"
                          class="btn btn-danger btn-sm">
                    Delete
                  </button>

                </form>
              </td>

            </tr>

            </tbody>

          </table>

          <!-- EDIT MODALS -->
          <div th:each="user : ${users}">

            <div class="modal fade"
                 th:id="'editModal-' + ${user.id}"
                 tabindex="-1"
                 aria-hidden="true">

              <div class="modal-dialog">

                <div class="modal-content">

                  <!-- HEADER -->
                  <div class="modal-header">

                    <h5 class="modal-title">
                      Edit user
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                  </div>


                  <!-- FORM -->
                  <form th:action="@{/admin/update}"
                        method="post"
                        autocomplete="off">

                    <div class="modal-body">

                      <!-- ID -->
                      <div class="mb-3">

                        <label class="form-label fw-semibold">
                          ID
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${user.id}"
                               disabled>

                        <input type="hidden"
                               name="id"
                               th:value="${user.id}">

                      </div>


                      <!-- FIRST NAME -->
                      <div class="mb-3">

                        <label class="form-label fw-semibold">
                          First Name
                        </label>

                        <input type="text"
                               class="form-control"
                               name="firstName"
                               th:value="${user.firstName}">

                      </div>


                      <!-- LAST NAME -->
                      <div class="mb-3">

                        <label class="form-label fw-semibold">
                          Last Name
                        </label>

                        <input type="text"
                               class="form-control"
                               name="lastName"
                               th:value="${user.lastName}">

                      </div>


                      <!-- AGE -->
                      <div class="mb-3">

                        <label class="form-label fw-semibold">
                          Age
                        </label>

                        <input type="number"
                               class="form-control"
                               name="age"
                               th:value="${user.age}">

                      </div>


                      <!-- USERNAME -->
                      <div class="mb-3">

                        <label class="form-label fw-semibold">
                          Username
                        </label>

                        <input type="text"
                               class="form-control"
                               name="username"
                               th:value="${user.username}"
                               autocomplete="off">

                      </div>


                      <!-- PASSWORD -->
                      <div class="mb-3">

                        <label class="form-label fw-semibold">
                          Password
                        </label>

                        <input type="password"
                               class="form-control"
                               name="password"
                               autocomplete="new-password"
                               value="">

                        <div class="form-text">
                          Leave empty to keep current password.
                        </div>

                      </div>


                      <!-- ROLES -->

                      <div class="mb-3">

                        <label class="form-label fw-semibold">
                          Roles
                        </label>

                        <div th:each="role : ${roles}"
                             class="form-check">

                          <input type="checkbox"
                                 class="form-check-input"
                                 name="roleIds"
                                 th:value="${role.id}"
                                 th:id="'edit-' + ${user.id} + '-role-' + ${role.id}"
                                 th:checked="${user.roles != null and user.roles.contains(role)}">

                          <label class="form-check-label"
                                 th:for="'edit-' + ${user.id} + '-role-' + ${role.id}"
                                 th:text="${role.name}">
                          </label>
                        </div>
                      </div>
                    </div>


                    <!-- FOOTER -->
                    <div class="modal-footer">

                      <button type="button"
                              class="btn btn-secondary"
                              data-bs-dismiss="modal">
                        Close
                      </button>

                      <button type="submit"
                              class="btn btn-primary">
                        Edit
                      </button>

                    </div>

                  </form>

                </div>

              </div>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
