<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>User Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <div class="container-fluid">

        <span class="navbar-text text-white">
            Admin panel
        </span>

        <form th:action="@{/logout}" method="post">
            <button type="submit"
                    class="btn btn-outline-light btn-sm">
                Logout
            </button>
        </form>

    </div>
</nav>


<div class="container-fluid">

    <div class="row">

        <!--SIDEBAR-->
        <div class="col-2 bg-light min-vh-100 p-0">

            <div class="list-group list-group-flush">

                <a th:href="@{/admin}"
                   class="list-group-item list-group-item-action active">
                    Admin
                </a>

                <a th:href="@{/user}"
                   class="list-group-item list-group-item-action">
                    User
                </a>

            </div>

        </div>


        <!--MAIN-->
        <div class="col-10 p-4">

            <h1 class="mb-4">Admin panel</h1>

            <!--TABS-->
            <ul class="nav nav-tabs mb-3">

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/admin}">
                        All Users
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active"
                       th:href="@{/admin/new}">
                        New User
                    </a>
                </li>

            </ul>


            <!--CARD-->
            <div class="card">

                <div class="card-header fw-bold"
                     th:text="${isCreate ? 'Add new user' : 'Edit user'}">
                </div>

                <div class="card-body">

                    <form th:action="${isCreate ? '/admin' : '/admin/update'}"
                          th:object="${user}"
                          method="post"
                          autocomplete="off">

                        <input th:if="${!isCreate}"
                               type="hidden"
                               th:field="*{id}">

                        <div class="row justify-content-center">

                            <div class="col-md-6 col-lg-4">

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        First Name
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{firstName}">
                                    <div class="text-danger"
                                         th:if="${#fields.hasErrors('firstName')}"
                                         th:errors="*{firstName}">
                                    </div>
                                </div>


                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        Last Name
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{lastName}">
                                    <div class="text-danger"
                                         th:if="${#fields.hasErrors('lastName')}"
                                         th:errors="*{lastName}">
                                    </div>
                                </div>


                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        Age
                                    </label>

                                    <input type="number"
                                           class="form-control"
                                           th:field="*{age}">
                                    <div class="text-danger"
                                         th:if="${#fields.hasErrors('age')}"
                                         th:errors="*{age}">
                                    </div>
                                </div>


                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        Username
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{username}"
                                           autocomplete="off">
                                    <div class="text-danger"
                                         th:if="${#fields.hasErrors('username')}"
                                         th:errors="*{username}">
                                    </div>
                                </div>


                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        Password
                                    </label>

                                    <!-- CREATE -->
                                    <input th:if="${isCreate}"
                                           type="password"
                                           class="form-control"
                                           th:field="*{password}"
                                           autocomplete="new-password">

                                    <!-- EDIT -->
                                    <input th:if="${!isCreate}"
                                           type="password"
                                           class="form-control"
                                           name="password"
                                           autocomplete="new-password"
                                           value="">

                                    <div th:if="${isCreate and #fields.hasErrors('password')}"
                                         class="text-danger"
                                         th:errors="*{password}">
                                    </div>
                                </div>


                                <div class="mb-3">

                                    <label class="form-label fw-semibold">
                                        Roles
                                    </label>

                                    <div th:each="role : ${roles}"
                                         class="form-check">

                                        <input type="checkbox"
                                               class="form-check-input"
                                               name="roleIds"
                                               th:value="${role.id}"
                                               th:id="'role-' + ${role.id}"
                                               th:checked="${!isCreate and user.roles != null and user.roles.contains(role)}">

                                        <label class="form-check-label"
                                               th:for="'role-' + ${role.id}"
                                               th:text="${role.name}">
                                        </label>

                                    </div>
                                </div>


                                <div class="mt-4 text-center">

                                    <button type="submit"
                                            class="btn btn-success">
                                        Add new user
                                    </button>

                                </div>

                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
